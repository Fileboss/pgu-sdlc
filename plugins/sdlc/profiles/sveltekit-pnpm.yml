# SvelteKit with pnpm. Scripts missing from package.json are skipped.
dev: pnpm dev
test: pnpm run --if-present test
lint: pnpm run --if-present lint && pnpm run --if-present check
build: pnpm build
dev_deps: eslint @eslint/js typescript-eslint globals eslint-config-prettier eslint-plugin-svelte prettier prettier-plugin-svelte typescript@^6
dependabot: npm
runtime: node
